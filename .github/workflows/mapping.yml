name: R8 mapping

# Rebuilds a release from this branch's commit and publishes R8's mapping.txt, so obfuscated crash
# reports from that version can be decoded. Signing does not affect the mapping.
on:
  push:
    branches: ['map-*']

permissions:
  contents: write

jobs:
  mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: sh scripts/fetch-fonts.sh
      - run: ./gradlew assembleRelease
      - name: Publish mapping
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: app/build/outputs/mapping/release/mapping.txt
